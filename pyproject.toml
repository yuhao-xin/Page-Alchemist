[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "page-alchemist"
version = "0.1.0"
description = "Extract, cleanse, restructure and re-publish Notion pages you are authorised to access, into your own workspace (Notion or Feishu/Lark) or an import-ready Markdown bundle."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Page Alchemist Contributors" }]
keywords = [
    "notion",
    "notion-api",
    "extractor",
    "clone",
    "knowledge-base",
    "automation",
    "agent-skill",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: News/Diary",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
page-alchemist = "page_alchemist.cli:main"
na = "page_alchemist.cli:main"

[project.urls]
Homepage = "https://github.com/yuhao-xin/page-alchemist"
Repository = "https://github.com/yuhao-xin/page-alchemist"
Issues = "https://github.com/yuhao-xin/page-alchemist/issues"
Documentation = "https://github.com/yuhao-xin/page-alchemist#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
