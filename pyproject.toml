[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "page-alchemist"
version = "0.2.1"
description = "Extract, cleanse, restructure and re-publish Notion pages you are authorised to access, into your own workspace (Notion or Feishu/Lark) or an import-ready Markdown bundle."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Page Alchemist Contributors" }]
keywords = [
    "notion",
    "notion-api",
    "extractor",
    "clone",
    "knowledge-base",
    "automation",
    "agent-skill",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: News/Diary",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
page-alchemist = "page_alchemist.cli:main"
na = "page_alchemist.cli:main"

[project.urls]
Homepage = "https://github.com/yuhao-xin/page-alchemist"
Repository = "https://github.com/yuhao-xin/page-alchemist"
Issues = "https://github.com/yuhao-xin/page-alchemist/issues"
Documentation = "https://github.com/yuhao-xin/page-alchemist#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

# Pinned on purpose. Ruff's *implicit* default grew over the 0.14+ releases
# (UP/RUF/FURB/B/S/... joined it), so `dev = ["ruff>=0.6"]` resolving to a
# newer release used to turn CI red overnight with ~300 findings that had
# nothing to do with the commit. A linter upgrade must not silently change
# what this project promises; widen this list deliberately, in its own commit.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# typing.List / Optional[X] are still correct for the declared floor (py39)
# and rewriting ~280 annotations is a modernisation pass of its own — see the
# v0.3 note in CHANGELOG.md.
