name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-stdlib:
    # proves the suite runs with zero dependencies (fresh clone, no pip)
    name: tests (stdlib runner, no deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suite without installing anything
        run: python scripts/run_tests.py

  test-pytest:
    name: tests (pytest) + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: ruff
        run: ruff check src tests scripts
      - name: CLI smoke (help/doctor/demo need no credentials)
        run: |
          page-alchemist --version
          page-alchemist --help
          page-alchemist doctor || true
          page-alchemist demo -o /tmp/ci-demo

  skillhub-preflight:
    name: SkillHub pre-flight self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # exit 2 = would be rejected; exit 1 = risks worth reviewing.
      # `run` uses `bash -e`, so capture the code before the step can abort.
      - name: Run the 12-item pre-flight checker
        shell: bash
        run: |
          set +e
          python scripts/skillhub_preflight.py
          code=$?
          set -e
          if [ "$code" -ge 2 ]; then
            echo "::error::SkillHub pre-flight would reject this package"
            exit 1
          fi
          if [ "$code" -eq 1 ]; then
            echo "::warning::SkillHub pre-flight reports risks (see log above)"
          fi
